<!DOCTYPE html>
<html>

<head>
<title>Zartour QR Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

</head>

<body style="font-family:Arial;text-align:center;margin-top:60px">

<h2>Zartour QR Generator</h2>

<input id="qrText" placeholder="Enter link or location" style="padding:10px;width:260px">

<br><br>

<button onclick="generateQR()">Generate QR</button>

<button onclick="downloadQR()">Download QR</button>

<div id="qrcode" style="margin-top:25px"></div>

<script>

function generateQR(){

document.getElementById("qrcode").innerHTML="";

new QRCode(document.getElementById("qrcode"),{
text:document.getElementById("qrText").value,
width:220,
height:220
});

}

function downloadQR(){

let canvas=document.querySelector("#qrcode canvas");

if(!canvas){
alert("Generate QR first");
return;
}

let png=canvas.toDataURL("image/png");

let link=document.createElement("a");

link.href=png;

link.download="zartour-qr.png";

link.click();

}

</script>

</body>

</html>
