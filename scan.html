<!DOCTYPE html>
<html>
<head>
<title>Zartour Scan</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<h1>Scanning Location...</h1>

<script>

const supabaseUrl = "YOUR_SUPABASE_URL"
const supabaseKey = "YOUR_PUBLIC_ANON_KEY"

const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey)

const params = new URLSearchParams(window.location.search)
const qrID = params.get("id")

  
let urlParams = new URLSearchParams(window.location.search)
let locationID = urlParams.get("id")

  async function trackScan(){

const { data: location } = await supabaseClient
.from("locations")
.select("*")
.eq("qr_id", qrID)
.single()

const userID = localStorage.getItem("user_id")

const { data: user } = await supabaseClient
.from("users")
.select("*")
.eq("id", userID)
.single()

if(user.current_step !== location.step_order){

alert("You must visit the previous location first!")

return

}

await supabaseClient
.from("users")
.update({
points: user.points + location.points,
current_step: user.current_step + 1
})
.eq("id", userID)

    }

async function trackScan(){

let { data } = await supabase
.from("locations")
.select("scan_count")
.eq("id", locationID)
.single()

let newCount = data.scan_count + 1

await supabase
.from("locations")
.update({ scan_count: newCount })
.eq("id", locationID)

}

trackScan()

async function trackScan(){

const { data } = await supabaseClient
.from("locations")
.select("*")
.eq("qr_id", qrID)
.single()

if(!data){
document.body.innerHTML="Invalid QR"
return
}

await supabaseClient
.from("locations")
.update({
scan_count: data.scan_count + 1
})
.eq("qr_id", qrID)

window.location.href = data.qr_link

}

trackScan()

</script>

</body>
</html>
